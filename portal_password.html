{% extends "base.html" %}
{% block title %}Change portal password{% endblock %}
{% block content %}
<div class="page-heading"><div><div class="eyebrow">ACCOUNT SECURITY</div><h1>Change password</h1><p class="muted">Choose a unique password with at least 10 characters.</p></div><a class="btn secondary" href="{{ url_for('portal.dashboard') }}">← Back to portal</a></div>
<form method="post" class="card form-card password-card"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label for="current_password">Current password</label><input id="current_password" name="current_password" type="password" autocomplete="current-password" required><label for="new_password">New password</label><input id="new_password" name="new_password" type="password" minlength="10" autocomplete="new-password" required><label for="confirm_password">Confirm new password</label><input id="confirm_password" name="confirm_password" type="password" minlength="10" autocomplete="new-password" required><div class="actions"><button type="submit">Update password</button></div></form>
{% endblock %}
